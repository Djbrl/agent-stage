<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tandemcode · the coding agent for learners</title>
    <meta name="description" content="They pedal, you steer. The coding agent you learn with: it explains, asks before it writes, and shows its work on a map." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Theme before first paint (same logic as src/theme.ts).
      try { var t = localStorage.getItem('theme'); if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Archivo:wdth,wght@100..125,600..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/site.tsx"></script>
  </body>
</html>
