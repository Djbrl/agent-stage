    <script>
      // Theme before first paint (same logic as src/theme.ts).
      try { var t = localStorage.getItem('theme'); if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
